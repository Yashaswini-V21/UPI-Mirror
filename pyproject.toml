[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kira-ai"
version = "3.1.0"
description = "AI-powered spending coach using LangGraph for adaptive behavioral nudges with Gemini 2.0"
requires-python = ">=3.11"
authors = [
    {name = "Kira-AI Team", email = "dev@kira-ai.local"}
]
license = {text = "MIT"}
keywords = ["ai", "spending", "coach", "behavioral", "fastapi", "react"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/Yashaswini-V21/Kira-AI"
Repository = "https://github.com/Yashaswini-V21/Kira-AI.git"
Documentation = "https://github.com/Yashaswini-V21/Kira-AI/blob/main/README.md"
Issues = "https://github.com/Yashaswini-V21/Kira-AI/issues"

[tool.black]
line-length = 120
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unreachable = true
show_error_codes = true
plugins = []

[[tool.mypy.overrides]]
module = [
    "google.generativeai",
    "langchain_core",
    "langgraph",
    "pydantic.v1",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short --strict-markers"
asyncio_mode = "strict"
filterwarnings = [
    "ignore::FutureWarning:google.generativeai",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["core_logic", "backend"]
omit = [
    "*/tests/*",
    "*/site-packages/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
