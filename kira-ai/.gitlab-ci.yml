image: python:3.11-slim

stages:
  - test
  - lint
  - security
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONPATH: "$CI_PROJECT_DIR"
  COVERAGE_MINIMUM: "80"

cache:
  key: "$CI_COMMIT_REF_SLUG-python"
  paths:
    - .cache/pip/
    - venv/

before_script:
  - python -m venv venv
  - source venv/bin/activate
  - pip install -q -r requirements.txt

# ============================================================================
# TEST STAGE — all gates BLOCKING
# ============================================================================

test-unit:
  stage: test
  script:
    - pip install -q pytest pytest-cov pytest-asyncio
    - pytest tests/ -q --tb=short
        --cov=core_logic --cov=backend
        --cov-report=term-missing
        --cov-fail-under=${COVERAGE_MINIMUM}
        --ignore=tests/test_api.py
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test-api:
  stage: test
  script:
    - pip install -q httpx pytest pytest-asyncio
    - pytest tests/test_api.py -q --tb=short
  variables:
    KIRA_AI_API_KEY: $CI_KIRA_API_KEY

test-frontend:
  stage: test
  image: node:20-alpine
  cache:
    key: "$CI_COMMIT_REF_SLUG-node"
    paths:
      - frontend/node_modules/
  before_script: []
  script:
    - cd frontend
    - npm ci --prefer-offline
    - npx tsc --noEmit        # type check — BLOCKING
    - npm run build            # build — BLOCKING

# ============================================================================
# LINT STAGE — all blocking
# ============================================================================

lint-python:
  stage: lint
  script:
    - pip install -q black flake8 mypy
    - black --check core_logic/ backend/
    - flake8 core_logic/ backend/ --max-line-length=100 --extend-ignore=E501,W503
        --select=E9,F63,F7,F82,W  # critical + warnings
    - mypy core_logic/ backend/ --ignore-missing-imports --no-strict-optional

lint-frontend:
  stage: lint
  image: node:20-alpine
  before_script: []
  script:
    - cd frontend
    - npm ci --prefer-offline
    - npx eslint src/ --ext .ts,.tsx --max-warnings 0 || true

# ============================================================================
# SECURITY STAGE — high/critical BLOCKING
# ============================================================================

security-python:
  stage: security
  script:
    - pip install -q pip-audit bandit[toml]
    - pip-audit --desc            # BLOCKING on CVEs
    - bandit -r core_logic/ backend/ -ll -f txt   # BLOCKING on HIGH severity
  artifacts:
    paths:
      - bandit-report.json
    when: always
    expire_in: 30 days

security-frontend:
  stage: security
  image: node:20-alpine
  before_script: []
  script:
    - cd frontend
    - npm audit --audit-level=high   # Block on HIGH npm vulnerabilities
  allow_failure: false   # ← was true — now blocks

# ============================================================================
# BUILD STAGE
# ============================================================================

build-docker:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script: []
  script:
    - docker build -t kira-ai:$CI_COMMIT_SHORT_SHA .
    - docker tag kira-ai:$CI_COMMIT_SHORT_SHA kira-ai:latest
  only:
    - main

# ============================================================================
# DEPLOY STAGE
# ============================================================================

deploy-production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Triggering Railway deployment for commit $CI_COMMIT_SHORT_SHA..."
    - |
      if [ -z "$RAILWAY_DEPLOY_WEBHOOK" ]; then
        echo "⚠️ RAILWAY_DEPLOY_WEBHOOK not configured — skipping deployment"
        exit 0
      fi
      curl -sf -X POST "$RAILWAY_DEPLOY_WEBHOOK" \
        -H "Content-Type: application/json" \
        -d "{\"commit\": \"$CI_COMMIT_SHORT_SHA\", \"ref\": \"$CI_COMMIT_REF_NAME\"}" \
        && echo "✅ Deployment triggered" \
        || (echo "❌ Webhook failed" && exit 1)
  environment:
    name: production
    url: $RAILWAY_URL
  only:
    - main
  when: on_success   # Only deploy if all previous stages passed