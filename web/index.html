  <!-- Fonts — preconnect first for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Kira-AI",
    "description": "AI-powered behavioral finance coach that predicts when you will run out of money and coaches you with daily nudges.",
    "url": "https://kira-ai.app",
    "applicationCategory": "FinanceApplication",
    "operatingSystem": "Web",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    }
  }
  </script>

  <style>
    /* Critical path CSS — prevents FOUC */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    html, body, #root { width: 100%; height: 100%; }
    body {
      background: #03040a;
      color: #ffffff;
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Skip-to-content for keyboard/screen-reader users */
    .skip-link {
      position: absolute;
      top: -100%;
      left: 0;
      z-index: 9999;
      padding: 12px 24px;
      background: #a855f7;
      color: white;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      border-radius: 0 0 8px 0;
      transition: top 0.2s;
    }
    .skip-link:focus { top: 0; }

    /* Global focus-visible ring — keyboard navigation */
    :focus-visible {
      outline: 2px solid #a855f7;
      outline-offset: 3px;
      border-radius: 4px;
    }
    :focus:not(:focus-visible) { outline: none; }

    /* Reduced-motion global off-switch — overrides all animations */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* App loading shimmer */
    #root:empty::after {
      content: '';
      position: fixed;
      inset: 0;
      background: #03040a;
    }

    /* Spin utility used by multiple components */
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 0.7s linear infinite; }

    /* Shimmer for skeleton */
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position:  200% 0; }
    }
    .animate-shimmer {
      animation: shimmer 1.6s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <!-- Skip-to-content landmark (WCAG 2.4.1) -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div id="root" role="application" aria-label="Kira-AI Finance Coach"></div>

  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
