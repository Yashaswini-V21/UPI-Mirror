name: Backend Tests & Coverage

on:
  push:
    branches: [main, develop, feat/**, feature/**]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Prefer pre-built wheels to avoid building heavy packages on runners
          pip install --prefer-binary -r requirements.txt
          pip install --prefer-binary pytest pytest-cov pytest-asyncio

      - name: Lint with flake8
        continue-on-error: true
        run: |
          pip install flake8 -q 2>/dev/null || true
          # Check for critical syntax errors only
          flake8 api/ src/ --count --select=E9,F63,F7,F82 --show-source --statistics 2>/dev/null || true
          echo "Flake8 linting complete"

      - name: Test with pytest
        env:
          KIRA_AI_API_KEY: ${{ secrets.KIRA_AI_API_KEY || 'test-kira-ci-key-12345678901234567890' }}
          ENVIRONMENT: test
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test-gemini-key-placeholder' }}
          PYTHONPATH: .
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing --tb=short

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
