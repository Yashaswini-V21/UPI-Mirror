name: Frontend Tests

on:
  push:
    branches: [main, develop, feat/**, feature/**]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: ["18", "20"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Check formatting with Prettier
        continue-on-error: true
        working-directory: ./web
        run: npx prettier --check src/ 2>/dev/null || echo "Prettier check completed with warnings"

      - name: Lint with ESLint
        continue-on-error: true
        working-directory: ./web
        run: npx eslint src/ --max-warnings 10 2>/dev/null || echo "ESLint check completed"

      - name: Type check with TypeScript
        continue-on-error: true
        working-directory: ./web
        run: npx tsc --noEmit 2>/dev/null || echo "TypeScript check completed"

      - name: Build frontend
        working-directory: ./web
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run build

      - name: Run tests (if test script exists)
        working-directory: ./web
        run: npm run test --if-present || echo "No test script configured"
