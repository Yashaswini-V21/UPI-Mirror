name: Security Scan

on:
  push:
    branches: [main, develop, feat/**, feature/**]
  pull_request:
    branches: [main, develop]

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety

      - name: Run Bandit security scan
        continue-on-error: true
        run: |
          bandit -r src/ api/ -f json -o bandit-report.json 2>/dev/null || true
          bandit -r src/ api/ -f txt 2>/dev/null || echo "Bandit scan completed with warnings"

      - name: Check for known vulnerabilities with Safety
        continue-on-error: true
        run: |
          safety check --json 2>/dev/null || true
          safety check 2>/dev/null || echo "Safety check completed with info"

      - name: Run GitGuardian secret scan
        uses: gitguardian/ggshield-action@master
        with:
          path: ./
          verbose: true
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        continue-on-error: true

      - name: Check for hardcoded secrets (truffleHog)
        run: |
          pip install truffleHog3
          trufflehog filesystem . --json > trufflehog-report.json || echo "Scan completed"
        continue-on-error: true

      - name: Upload security reports
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: |
            bandit-report.json
            trufflehog-report.json
        if: always()
