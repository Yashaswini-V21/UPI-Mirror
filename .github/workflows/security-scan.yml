name: Security Scan — Enforced

on:
  push:
    branches: [main, develop, "feat/**", "feature/**"]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * 1"   # Weekly Monday 02:00 UTC

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit[toml] safety pip-audit

      # ── BLOCKING: No HIGH/CRITICAL Bandit issues allowed ──────────────────

      - name: Bandit security scan (BLOCKING on HIGH severity)
        run: |
          bandit -r src/ api/ \
            --severity-level high \
            --confidence-level high \
            -f json -o bandit-report.json
          bandit -r src/ api/ \
            --severity-level high \
            --confidence-level high \
            -f txt
        # Exits non-zero if any HIGH+HIGH findings — CI fails

      # ── BLOCKING: Known CVEs in dependencies ──────────────────────────────

      - name: pip-audit (known CVEs, BLOCKING)
        run: |
          pip-audit --desc --format=json -o pip-audit-report.json
          pip-audit --desc
        # Exits non-zero if vulnerable packages found

      # ── INFORMATIONAL: Safety database check ──────────────────────────────

      - name: Safety check (informational only)
        run: safety check 2>/dev/null || echo "Safety findings above — review manually"
        continue-on-error: true   # Safety can have false positives; informational

      # ── GitGuardian secret detection ──────────────────────────────────────

      - name: GitGuardian secret scan
        uses: gitguardian/ggshield-action@main
        with:
          path: ./
          verbose: true
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        continue-on-error: true   # Only blocks if GITGUARDIAN_API_KEY is set

      # ── Grep for obvious hardcoded secrets ────────────────────────────────

      - name: Check for hardcoded secrets (BLOCKING on clear-text tokens)
        run: |
          echo "Scanning for hardcoded API keys / tokens..."
          # Fail if any file contains clear-text API key patterns
          if grep -rn \
            -e 'AKIA[0-9A-Z]{16}' \
            -e 'sk-[a-zA-Z0-9]{32,}' \
            -e 'ghp_[a-zA-Z0-9]{36}' \
            --include="*.py" --include="*.ts" --include="*.tsx" \
            --exclude-dir=".git" --exclude-dir="node_modules" \
            .; then
            echo "❌ Hardcoded secrets detected — failing build"
            exit 1
          fi
          echo "✅ No hardcoded secrets found"

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.sha }}
          path: |
            bandit-report.json
            pip-audit-report.json
          retention-days: 30
        if: always()
